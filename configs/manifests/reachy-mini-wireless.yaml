# Reachy Mini Wireless (SPEC 4A). Limits from the SDK docs (head pitch/roll ±40°, head yaw
# ±180°, body ±160°, head-body yaw delta 65°) and the SDK hardware config (antennas: full turn;
# sleep pose at ±175°). Dynamics are null until measured in M0: load with --dev until then.
robot:
  id: reachy-mini-wireless
  driver: reachy_mini_sdk
  profile: cm4                    # CPU-only, runs on the robot's CM4
  connection: {mode: localhost_only, media_backend: local}
  # The daemon announces _reachy-mini._tcp with TXT model/robot_name/version (SDK 1.11).
  discovery: {mdns_service: _reachy-mini._tcp, match_txt: {model: Reachy Mini Wireless}}
pose_groups:                      # the SDK addresses poses, not servos
  head:
    type: pose6d
    limits:
      pitch_deg: [-40, 40]
      roll_deg: [-40, 40]
      yaw_deg: [-180, 180]
      # Translations: placeholders to be measured in M0. They must include the SDK sleep pose
      # (x -21 mm, z -44 mm; -50 mm measured in the MuJoCo sim), or start-up would fight it.
      x_mm: [-25, 15]
      y_mm: [-15, 15]
      z_mm: [-55, 15]
  body_yaw:
    type: joint
    limits: {min_deg: -160, max_deg: 160}
  antennas:
    type: joint_pair
    names: [antenna_right, antenna_left]      # SDK order is [right, left]
    limits: {min_deg: -175, max_deg: 175}
    home_deg: [-10, 10]                       # SDK INIT_ANTENNAS_JOINT_POSITIONS
constraints:
  - {type: yaw_delta, a: head.yaw, b: body_yaw, max_deg: 65}
dynamics:               # velocity and acceleration caps, measured in M0; required before release
  head:     {max_vel_dps: null, max_acc_dps2: null, max_lin_vel_mps: null, max_lin_acc_mps2: null}
  body_yaw: {max_vel_dps: null, max_acc_dps2: null}
  antennas: {max_vel_dps: null, max_acc_dps2: null}
sensors:
  camera_main: {driver: reachy_mini_media}
  mic_array:   {driver: reachy_mini_media, doa: true}
  imu:         {driver: reachy_mini_imu}      # Wireless only
expressive_channels:
  voice: {type: speaker, driver: reachy_mini_media}
  body:  {type: pose_groups, groups: [head, body_yaw, antennas]}
motor_modes: {active: enabled, limp: disabled, teach: gravity_compensation}
retargeting:            # mirror module (SPEC 9)
  head.yaw:      {source: head_yaw,   scale: 1.0}
  head.pitch:    {source: head_pitch, scale: 1.0}
  head.roll:     {source: head_roll,  scale: 1.0}
  body_yaw:      {source: torso_yaw,  scale: 1.0}
  antenna_left:  {source: left_arm_elevation,  scale: 0.5}
  antenna_right: {source: right_arm_elevation, scale: 0.5}
safety:
  estop: none                 # no hardware e-stop input on Reachy Mini
  soft_stop: hold_position
  hard_stop: disable_motors
  watchdog_ms: 200
behaviour:                      # config layer 2 (SPEC 11A): this robot's defaults
  # Name (SPEC 4A, 8 stage 3): the default name when the owner and the daemon give none, and the
  # spellings the small Vosk models produce for it (`reachy` itself is out of their vocabulary).
  # Voice (SPEC 8): a child-like, gender-neutral voice, chosen by ear by the owner (2026-10-21).
  # The dsp pitch shift is varispeed, so the formants move with the pitch. The limits are wider than
  # the library's (-4, 4) so moods (-2.5 to +3 x expressivity), the sentence variation (+-0.8 and a
  # question's +1, x expressivity), the energy curve (-1 to +0.5) and the register's pitch_st keep
  # room; the delivery clamps at +8 (2^(8/12) = 1.59x length_scale), which a surprised question
  # can reach: liveliness comes mostly from rate, pauses, variability and volume.
  # Only the name fields and `base.pitch_st` / `limits.pitch_st` may sit under `voice` in a manifest.
  voice:
    base: {pitch_st: 5}
    limits: {pitch_st: [-4, 8]}
    default_name: Reachy
    keywords:
      it: {name_aliases: [reati]}
      en: {name_aliases: [riyadh she]}
  # Loop rates (SPEC 11A): the arbiter streams `set_target` at 50 Hz over the daemon websocket
  # (the library default is 100 Hz); the app's behaviour tick keeps its 20 Hz default.
  # Only these two rates may sit under `motion` in a manifest.
  motion:
    arbiter: {loop_hz: 50}
  # Expression map (SPEC 7): per affect label, keyframes per channel as [t_s, offset_deg],
  # piecewise-linear, added on top of the current pose. Every channel starts and ends at 0 and
  # all channels of a label end together; `repeat` plays the cycle back to back.
  # Antennas carry most of the affect (SPEC 4A); no LED, no sound in M2. Channels the robot
  # lacks are skipped. Signs (SDK order is [right, left]): antenna lift toward vertical is
  # right +, left -; droop / outward is right -, left +; head.pitch negative is up. The signs
  # follow the connectivity gestures (gesture_map, below) and are not yet checked on the
  # hardware. All offsets are starting points to tune, scaled by the register and the persona
  # at runtime.
  expression_map:
    joy:                        # fast antenna wiggle, 3 flaps in 1.35 s
      repeat: 3
      channels:
        antenna_right: [[0.0, 0], [0.15, 18], [0.3, -8], [0.45, 0]]
        antenna_left:  [[0.0, 0], [0.15, -18], [0.3, 8], [0.45, 0]]
    curiosity:                  # antennas raised and still, small head tilt, 2.4 s
      channels:
        antenna_right: [[0.0, 0], [0.5, 15], [1.8, 15], [2.4, 0]]
        antenna_left:  [[0.0, 0], [0.5, -15], [1.8, -15], [2.4, 0]]
        head.roll:     [[0.0, 0], [0.5, 6], [1.8, 6], [2.4, 0]]
    sadness:                    # antennas drooping, head slightly down, 4 s
      channels:
        antenna_right: [[0.0, 0], [1.2, -20], [2.8, -20], [4.0, 0]]
        antenna_left:  [[0.0, 0], [1.2, 20], [2.8, 20], [4.0, 0]]
        head.pitch:    [[0.0, 0], [1.2, 6], [2.8, 6], [4.0, 0]]
    surprise:                   # quick antenna lift, small head pitch up, 1.2 s
      channels:
        antenna_right: [[0.0, 0], [0.2, 25], [0.6, 25], [1.2, 0]]
        antenna_left:  [[0.0, 0], [0.2, -25], [0.6, -25], [1.2, 0]]
        head.pitch:    [[0.0, 0], [0.2, -6], [0.6, -6], [1.2, 0]]
    sleepy:                     # slow droop with a head tilt, 5 s
      channels:
        antenna_right: [[0.0, 0], [2.0, -12], [3.2, -12], [5.0, 0]]
        antenna_left:  [[0.0, 0], [2.0, 12], [3.2, 12], [5.0, 0]]
        head.roll:     [[0.0, 0], [2.0, 8], [3.2, 8], [5.0, 0]]
        head.pitch:    [[0.0, 0], [2.0, 4], [3.2, 4], [5.0, 0]]
    calm:                       # gentle, small, slow, 4 s
      channels:
        antenna_right: [[0.0, 0], [2.0, 4], [4.0, 0]]
        antenna_left:  [[0.0, 0], [2.0, -4], [4.0, 0]]
        head.roll:     [[0.0, 0], [2.0, 2], [4.0, 0]]
    fear:                       # antennas back with a tremble, a small withdraw (head pitch up, never toward), 2.2 s
      channels:
        antenna_right: [[0.0, 0], [0.2, -15], [0.35, -10], [0.5, -15], [0.65, -10], [0.8, -15], [1.4, -15], [2.2, 0]]
        antenna_left:  [[0.0, 0], [0.2, 15], [0.35, 10], [0.5, 15], [0.65, 10], [0.8, 15], [1.4, 15], [2.2, 0]]
        head.pitch:    [[0.0, 0], [0.3, -4], [1.4, -4], [2.2, 0]]
    annoyance:                  # short flick of the right antenna, 0.5 s
      channels:
        antenna_right: [[0.0, 0], [0.1, 20], [0.3, -6], [0.5, 0]]
  # Named gestures for the play skill (SPEC 7, 11): same format as above, not affect labels.
  # head.pitch positive is down, so a nod dips then lifts a little; yaw is symmetric. Degrees
  # are well inside the +-40 / +-180 limits; the renderer scales and clamps them at runtime.
  # Segments last about 0.3 s so the motion still reads under the dev fallback caps (0.5 rad/s).
  gesture_map:
    nod:                        # head pitch oscillation ("yes"), 2 cycles in 1.8 s, 0.3 s per dip
      repeat: 2
      curve: minjerk
      channels:
        head.pitch: [[0.0, 0], [0.3, 12], [0.6, -3], [0.9, 0]]
    shake:                      # head yaw oscillation ("no"), 2 cycles in 2.6 s, 0.7 s across
      repeat: 2
      curve: minjerk
      channels:
        head.yaw: [[0.0, 0], [0.3, 12], [1.0, -12], [1.3, 0]]
    # Connectivity gestures (SPEC 12A, Behaviour while offline): core plays them by name when a link
    # comes back (perk_up) or someone speaks while the network is down (puzzled). 1.2 s each, the
    # pose reached at 30% and left at 70% of it. 0.15 rad = 8.594367 deg, 0.4 rad = 22.918312 deg,
    # 0.08 rad = 4.583662 deg. Signs as in the expression map: puzzled tilts the head and spreads
    # the antennas outward, perk_up lifts the head (pitch negative) and the antennas toward vertical.
    puzzled:
      curve: minjerk
      channels:
        head.roll:     [[0.0, 0], [0.36, 8.594367], [0.84, 8.594367], [1.2, 0]]
        antenna_right: [[0.0, 0], [0.36, -22.918312], [0.84, -22.918312], [1.2, 0]]
        antenna_left:  [[0.0, 0], [0.36, 22.918312], [0.84, 22.918312], [1.2, 0]]
    perk_up:
      curve: minjerk
      channels:
        head.pitch:    [[0.0, 0], [0.36, -4.583662], [0.84, -4.583662], [1.2, 0]]
        antenna_right: [[0.0, 0], [0.36, 22.918312], [0.84, 22.918312], [1.2, 0]]
        antenna_left:  [[0.0, 0], [0.36, -22.918312], [0.84, -22.918312], [1.2, 0]]
  # Circadian motion (SPEC 7A, Effects by state): same keyframe format and signs as above.
  # `yawn` plays now and then while drowsy, `stretch` for 3 s when the robot wakes from resting,
  # `rest_pose_deg` is the absolute rest posture (head.pitch positive is down; antennas droop
  # outward). All starting points to tune, not yet checked on the hardware; the limiter applies
  # as to every motion.
  circadian_motion:
    rest_pose_deg:
      head.pitch: 20
      antenna_right: -50
      antenna_left: 50
    yawn:                       # antennas droop, head tips back then tilts, 3 s
      channels:
        antenna_right: [[0.0, 0], [1.0, -15], [1.8, -15], [3.0, 0]]
        antenna_left:  [[0.0, 0], [1.0, 15], [1.8, 15], [3.0, 0]]
        head.pitch:    [[0.0, 0], [1.0, -8], [1.8, -8], [3.0, 0]]
        head.roll:     [[0.0, 0], [1.0, 6], [1.8, 6], [3.0, 0]]
    stretch:                    # antennas up and out, head lifts, 3 s
      channels:
        antenna_right: [[0.0, 0], [0.8, 25], [2.0, 25], [3.0, 0]]
        antenna_left:  [[0.0, 0], [0.8, -25], [2.0, -25], [3.0, 0]]
        head.pitch:    [[0.0, 0], [1.0, -12], [2.0, -12], [3.0, 0]]
