[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "roboemot-core"
version = "0.1.0.dev0"
description = "RoboEmot core: configuration, manifest, motion reference, affect, circadian rhythm, LLM router"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7,<3",
  "pyyaml>=6",
  "numpy>=1.26",
  "openai>=1.40",
  "httpx>=0.27",
  "psutil>=5.9",
  # Catalogue import (XMP) parses untrusted files: defusedxml forbids DTDs and entities, which the
  # stdlib parser only guarantees on a recent expat (a platform property).
  "defusedxml>=0.7.1",
]

[project.optional-dependencies]
# Finding robots on the LAN by mDNS (roboemot discover, the install wizard); not needed on the robot.
discovery = ["zeroconf>=0.132"]
# The robot installer (runs on the PC): mDNS plus sondalab-palette's terminal colour roles.
install = ["zeroconf>=0.132", "sondalab-palette>=0.3.8"]
# ONNX vision backends (YuNet, SFace, DINOv2, NanoDet): `roboemot models fetch`
# gets the weights.
vision = ["onnxruntime>=1.18", "onnx>=1.16", "opencv-python-headless>=4.9"]
# Voice (SPEC 8): Silero VAD on ONNX Runtime and Vosk streaming ASR. Piper is not a dependency: it
# is GPL-3.0 and runs as a separate process.
voice = ["onnxruntime>=1.18", "vosk>=0.3.44"]
# Realtime speech route (SPEC 8): the WebSocket client. Off by default; on Reachy Mini the SDK
# already requires websockets>=12,<16, so the robot's version is kept.
realtime = ["websockets>=13,<16"]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "ruff>=0.6",
  "zeroconf>=0.132",
  "sondalab-palette>=0.3.8",
  "websockets>=13,<16",
]

[project.scripts]
roboemot = "roboemot.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/roboemot"]
