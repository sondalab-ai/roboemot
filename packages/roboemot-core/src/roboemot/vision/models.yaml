# Vision model manifest (SPEC 5, 13). Files are never committed and never downloaded at import:
# `roboemot models fetch` downloads them into the models folder and verifies the sha256.
# `path` mirrors the layout of the M1 spike cache (scripts/bench/fetch.py), so
# `--cache-dir ~/.cache/roboemot-bench/models` works with models fetched there.
# `labels` is the output order read from each classifier's config.json id2label (pinned by
# labels_sha256) or from the pinned file's own metadata.
# The sha256 values were computed on the files the spike measured; a mismatch deletes the
# download. Licence fields are the weight licences checked in docs/spikes/2026-10-m1-models.md;
# the ONNX conversion repositories (Hugging Face onnx-community, Xenova) carry no licence tag
# of their own, and the licence of the training data was not verified.
# Files with `quantize` (none since the FairFace INT8 pair was retired) are not downloaded:
# `roboemot models fetch` produces them from the verified FP32 `source` file with ONNX Runtime
# dynamic quantization (SPEC 5, 13); their digest depends on the ORT version, so it is recorded
# in the `.verified` marker, not pinned here.
models:
  - name: yunet
    role: face_detector
    licence: MIT
    source: https://github.com/opencv/opencv_zoo/tree/main/models/face_detection_yunet
    files:
      - path: opencv_zoo/face_detection_yunet_2023mar.onnx
        url: https://github.com/opencv/opencv_zoo/raw/main/models/face_detection_yunet/face_detection_yunet_2023mar.onnx
        sha256: 8f2383e4dd3cfbb4553ea8718107fc0423210dc964f9f4280604804ed2552fa4
        size_bytes: 232589
  - name: sface
    role: face_embedder
    licence: Apache-2.0
    source: https://github.com/opencv/opencv_zoo/tree/main/models/face_recognition_sface
    files:
      - path: opencv_zoo/face_recognition_sface_2021dec.onnx
        url: https://github.com/opencv/opencv_zoo/raw/main/models/face_recognition_sface/face_recognition_sface_2021dec.onnx
        sha256: 0ba9fbfa01b5270c96627c4ef784da859931e02f04419c829e83484087c34e79
        size_bytes: 38696353
  - name: dinov2-small
    role: appearance_embedder
    licence: Apache-2.0
    source: https://huggingface.co/facebook/dinov2-small
    notes: ONNX conversion by Xenova (no licence stated on the conversion repository)
    files:
      - path: dinov2_small/model.onnx
        url: https://huggingface.co/Xenova/dinov2-small/resolve/main/onnx/model.onnx
        sha256: 83141175ec78b4ff9a2bb58a4c7c264ba0054d1c2e122e5a8114b79a8d4179ea
        size_bytes: 88459888
  - name: nanodet-plus-m-320
    role: object_detector
    licence: Apache-2.0
    source: https://github.com/RangiLyu/nanodet/releases/tag/v1.0.0-alpha-1
    notes: >-
      NanoDet-Plus-m 320x320, COCO 80 classes, ONNX published by the authors in the release
      (source repository and its weights carry one licence, Apache-2.0:
      https://github.com/RangiLyu/nanodet/blob/main/LICENSE). Trained on COCO train2017
      (annotations CC BY 4.0, images Flickr under their own terms); the training-data licence
      was not verified. Scores in the output are already sigmoid.
    labels: ["person", "bicycle", "car", "motorcycle", "airplane", "bus", "train", "truck", "boat", "traffic_light", "fire_hydrant", "stop_sign", "parking_meter", "bench", "bird", "cat", "dog", "horse", "sheep", "cow", "elephant", "bear", "zebra", "giraffe", "backpack", "umbrella", "handbag", "tie", "suitcase", "frisbee", "skis", "snowboard", "sports_ball", "kite", "baseball_bat", "baseball_glove", "skateboard", "surfboard", "tennis_racket", "bottle", "wine_glass", "cup", "fork", "knife", "spoon", "bowl", "banana", "apple", "sandwich", "orange", "broccoli", "carrot", "hot_dog", "pizza", "donut", "cake", "chair", "couch", "potted_plant", "bed", "dining_table", "toilet", "tv", "laptop", "mouse", "remote", "keyboard", "cell_phone", "microwave", "oven", "toaster", "sink", "refrigerator", "book", "clock", "vase", "scissors", "teddy_bear", "hair_drier", "toothbrush"]
    labels_source: https://github.com/RangiLyu/nanodet/raw/v1.0.0-alpha-1/config/nanodet-plus-m_320.yml
    labels_sha256: 232f73b8f0c2f66358dbc2dfbf6ab45332855847dac993e85c0dbd99052bf98b
    files:
      - path: nanodet_plus/nanodet-plus-m_320.onnx
        url: https://github.com/RangiLyu/nanodet/releases/download/v1.0.0-alpha-1/nanodet-plus-m_320.onnx
        sha256: 4f12723cce3d48e47ca92cb925ba74d97a965c069208edca660bbb9f7ce2c610
        size_bytes: 4793615
# Files of models that were replaced or removed (SPEC 5, 13; the yolo11n-face-age age model went
# with the owner decision 2026-10-23 to estimate no age): `roboemot models prune` deletes them
# and their markers from a models folder that still has them. Nothing loads them any more.
retired:
  - fairface/age_model.onnx
  - fairface/gender_model.onnx
  - fairface_int8/age_model.onnx
  - fairface_int8/gender_model.onnx
  - yolo11n_face_age/model.onnx
