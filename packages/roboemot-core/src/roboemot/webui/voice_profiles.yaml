# The voice-provider switch of the Settings page (SPEC 8, 11A, 12; roboemot.webui.voice_switch).
#
# Every choice writes every key of `keys`, so the result never depends on what was set before. A
# key a choice does not name takes its schema default. The robot platform's own route takes its
# values from the robot's settings plugin (`voice_profile`, the installer's cloud-voice profile),
# on top of `common`.
#
# The current choice is the one whose `match` keys all equal the effective config; with the
# realtime route on in that choice, its `match_realtime` keys must equal too, and a direct route
# does not compare `unmatched_direct`. The private keys (the privacy opt-ins) are compared only
# after the PIN. The other keys are tuning: a hand-tuned timeout or wake policy keeps the choice,
# and a switch writes them all again. `input: text` on a realtime route is a hand edit: Custom.
keys:
  - voice.enabled
  - voice.realtime_route.enabled
  - voice.realtime_route.route
  - voice.realtime_route.mode
  - voice.realtime_route.input
  - voice.realtime_route.turns
  - voice.realtime_route.audio_gate
  - voice.realtime_route.transcript_timeout_s
  - voice.realtime_route.skip_tool
  - voice.realtime_route.tone_tool
  - voice.backend
  - voice.fallback_backend
  - voice.wake_word_policy
  - voice.direction.enabled
  - voice.facing.enabled
  - privacy.realtime_audio
  - privacy.realtime_audio_unaddressed
match:
  - voice.enabled
  - voice.realtime_route.enabled
  - voice.backend
  - voice.fallback_backend
  - privacy.realtime_audio
  - privacy.realtime_audio_unaddressed
match_realtime:
  - voice.realtime_route.route
  - voice.realtime_route.mode
  - voice.realtime_route.input
# A Gemini choice writes realtime_audio_unaddressed off (robot turns only, so it can never act);
# a robot switched before keeps it on and still reads as its route (owner decision 2026-11-16).
unmatched_direct:
  - privacy.realtime_audio_unaddressed
common:
  voice.enabled: true
# Piper speaks and Vosk listens on the robot; nothing leaves it.
local:
  voice.realtime_route.enabled: false
  voice.backend: piper
  voice.fallback_backend: piper
# Any other kind: realtime route, connected to its own URL. voice.realtime_route.route is the
# route's name. The realtime and privacy keys are the cloud-voice profile's.
direct:
  voice.realtime_route.enabled: true
  voice.realtime_route.mode: direct
  voice.realtime_route.input: audio
  # Kept from the owner's tested Gemini setup (2026-11-16), not the schema's 4 s.
  voice.realtime_route.transcript_timeout_s: 10.0
  voice.realtime_route.skip_tool: true
  voice.realtime_route.tone_tool: true
  voice.backend: none
  voice.fallback_backend: none
  voice.wake_word_policy: never
  voice.direction.enabled: true
  voice.facing.enabled: true
  privacy.realtime_audio: true
  privacy.realtime_audio_unaddressed: true
# On top of `direct`, per route protocol.
protocols:
  gemini_live:
    voice.realtime_route.turns: robot
    privacy.realtime_audio_unaddressed: false
