# Voice model manifest (SPEC 8 stages 2, 3, 7). Same format and rules as vision/models.yaml:
# nothing is committed or downloaded at import; `roboemot models fetch --voice` downloads into
# the voice models folder (voice.models_dir) and verifies size and sha256. Every URL is pinned
# to an exact release, tag or commit, and the digests were computed on the downloaded files.
# `archive: zip` files are unpacked into the folder named by `path`; size_bytes and sha256 are
# those of the zip, unpacked_bytes caps the unpacked total.
# Licences: Silero VAD MIT; Vosk models Apache-2.0 (alphacephei.com/vosk/models). The Piper
# voices are fine-tuned from the lessac voice and each MODEL_CARD only points at the dataset
# ("License: See URL"), so the voice licence is the dataset's and was not independently verified
# (it_IT-paola: huggingface.co/datasets/paolapersico1/Voice-Dataset-Italian; en_US-amy:
# github.com/MycroftAI/mimic3-voices). The Piper engine is GPL-3.0 and runs as its own process.
