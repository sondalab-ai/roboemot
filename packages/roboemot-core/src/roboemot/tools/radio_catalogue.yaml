# The station catalogue of the web UI's Tools tab (SPEC 11, Voice tools, Radio). Nothing here
# plays: a station plays only once a person adds it to tools.radio.stations.
#
# Checked 2026-11-17. Every url answered 200 with an audio content type and no redirect (no -L),
# and sent audio bytes. SomaFM refuses curl's and browsers' user agents, so its URLs were checked
# with the user agent the robot's decoder sends (GStreamer souphttpsrc); see SPEC 11, Radio.
#
# official: false marks a stream whose operator publishes no permission for third-party players:
# Radio France (no published third-party policy) and SomaFM (its terms grant no permission to
# third-party clients, https://somafm.com/contact/tos.html; included by owner decision 2026-11-17).
