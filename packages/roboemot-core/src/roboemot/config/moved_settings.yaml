# Settings renamed or removed since an overrides file or app.yaml may have been written
# (SPEC 11A, Renamed and removed settings). Data, not code: it records old names on purpose.
# `removed` keys have a replacement and fail in app.yaml; `dropped` keys have none and are
# ignored wherever they are found (`*` matches every entry of a list or value of a mapping).
renamed:
  reflexes.antenna_ratio: reflexes.startle_lift_ratio
removed:
  connectivity.gestures: the manifest gesture_map entries puzzled and perk_up (SPEC 12A)
dropped:
  safety.minors_allowed_llm: the LLM is used while a minor is present (SPEC 8, 2026-10-22)
  llm_routes.*.allowed_for_minors: the LLM is used while a minor is present (SPEC 8, 2026-10-22)
