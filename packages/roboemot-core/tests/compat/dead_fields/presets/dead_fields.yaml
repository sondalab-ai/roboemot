# Compat fixture (d): a personality preset that sets the preset-level fields S6 drops.
extends: default
schema_version: 1
motion:
  arbiter: {source_timeout_ms: 300}
  idle: {gaze_shift_interval_s: [2, 6], gaze_shift_amplitude: 0.08}
mirror:
  keypoint_confidence_min: 0.6
  hold_decay_s: 1.5
  filter_min_cutoff_hz: 1.2
  filter_beta: 0.07
  mirror_image: false
  record_max_s: 8
privacy:
  multimodal_frames: true
  keep_enrollment_images: true
  debug_recording: true
