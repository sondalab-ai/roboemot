# Compat fixture (d): a plain install plus every field the dead-fields slice (S6) drops.
schema_version: 1
circadian:
  timezone: Europe/Rome
safety:
  allow_unmeasured_dynamics: true
voice:
  enabled: true
motion:
  arbiter:
    source_timeout_ms: 300
  idle:
    gaze_shift_interval_s: [2, 6]
    gaze_shift_amplitude: 0.1
mirror:
  keypoint_confidence_min: 0.6
  hold_decay_s: 1.5
  filter_min_cutoff_hz: 1.2
  filter_beta: 0.07
  mirror_image: false
  record_max_s: 8
llm_routes:
- name: lan
  kind: chat
  base_url: http://192.168.1.20:11434/v1
  model: llama3.2-vision
  locality: local
  supports_images: true
privacy:
  multimodal_frames: true
  keep_enrollment_images: true
  debug_recording: true
