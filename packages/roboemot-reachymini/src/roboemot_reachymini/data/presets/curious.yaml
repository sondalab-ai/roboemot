# Personality preset: curious (SPEC 11A example)
extends: default
schema_version: 1
persona:
  traits: {energy: 1.0, playfulness: 0.8}   # livelier motion, idle and voice; reactions one step up
affect:
  half_life_s: 6
appraisal:
  rules:            # merged with the default rules by `event` (and `when`); overrides the default stranger rule
    - {event: person.unknown_appears, valence: 0.2, arousal: 0.4, label: curiosity, cooldown_s: 30}
motion:
  idle: {gaze_shift_interval_s: [2, 6]}
circadian:
  quiet_hours: ["22:30", "07:00"]
