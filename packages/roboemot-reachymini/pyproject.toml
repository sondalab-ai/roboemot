[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "roboemot-reachymini"
version = "0.1.0.dev0"
description = "RoboEmot driver and SDK bridge for Pollen Robotics' Reachy Mini"
requires-python = ">=3.11"
dependencies = ["roboemot-core", "numpy>=1.26", "scipy>=1.11", "httpx>=0.27"]

[project.optional-dependencies]
# The SDK pulls GStreamer/PyGObject; keep it optional so unit tests run without it. The package
# requires at least 1.12; the simulator extra (the sim CI job) stays on 1.12.x, the version the
# code is tested against (sdk.TESTED_SDK), so CI matches the robot.
sdk = ["reachy-mini>=1.12"]
sim = ["reachy-mini[mujoco]>=1.12,<1.13"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]

[project.entry-points."reachy_mini_apps"]
# The daemon runs `python -m <module of this entry point>`, so it must be the module with the
# __main__ runner (main.py), not app.py.
roboemot = "roboemot_reachymini.main:RoboEmotApp"

# Robot platform (driver, camera, audio, maps), keyed by manifest robot.id (SPEC 4A).
[project.entry-points."roboemot.robots"]
reachy-mini-wireless = "roboemot_reachymini.platform:ReachyMiniPlatform"

# Debug report sources, keyed by manifest robot.id (SPEC 12A, Diagnostics).
[project.entry-points."roboemot.diagnostics"]
reachy-mini-wireless = "roboemot_reachymini.diagnostics:sources"

# Robot installer platform, keyed by manifest robot.id (SPEC 4A, Packaging).
[project.entry-points."roboemot.installers"]
reachy-mini-wireless = "roboemot_reachymini.install:ReachyMiniWireless"

# World sources and scan planner, keyed by manifest robot.id (SPEC 5A, Observations and sources).
[project.entry-points."roboemot.world"]
reachy-mini-wireless = "roboemot_reachymini.world:plugin"

# Web UI settings section (robot rows and claimed config paths), keyed by manifest robot.id (SPEC 12).
[project.entry-points."roboemot.settings"]
reachy-mini-wireless = "roboemot_reachymini.settings:plugin"

# Recorded expression clips (Pollen's emotions library, converted), keyed by manifest robot.id
# (SPEC 4A, Recorded emotions; SPEC 7, Recorded clips).
[project.entry-points."roboemot.expression_clips"]
reachy-mini-wireless = "roboemot_reachymini.clips:library"

[tool.hatch.build.targets.wheel]
packages = ["src/roboemot_reachymini"]
