# Workspace-level tooling configuration (the installable packages live in packages/).
[tool.pytest.ini_options]
testpaths = ["packages/roboemot-core/tests", "packages/roboemot-reachymini/tests"]
markers = [
  "sim: needs the MuJoCo Reachy Mini daemon (scripts/sim-daemon.sh)",
  "hil: needs the real robot; never runs in CI",
  "models: runs the real ONNX models (vision extra and fetched weights); opt in with -m models",
]
addopts = "-m 'not sim and not hil and not models'"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["*.md"]  # docs are hand-written: never reformat

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
